apiVersion: v1
kind: Service
metadata:
  name: trading-service
  labels:
    component: trading
spec:
  type: NodePort
  selector:
    component: trading
    role: backend
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30007

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-backend
  labels:
    component: trading
spec:
  replicas: 2
  selector:
    matchLabels:
      component: trading
      role: backend
  template:
    metadata:
      labels:
        component: trading
        role: backend
    spec:
      containers:
        - name: trading-app
          image: trading-app:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-db:5432/tradingdb
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password